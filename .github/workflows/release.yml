name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify application version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content SSHMonitor.csproj
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
            throw "Project version $projectVersion does not match tag $tagVersion"
          }
      - name: Publish self-contained Windows app
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None --output artifacts/SSHMonitor-win-x64
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/SSHMonitor-win-x64/* -DestinationPath artifacts/SSHMonitor-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/SSHMonitor-${{ github.ref_name }}-win-x64.zip
